<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59, 130, 246, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />
  <rect width="1200" height="600" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="220" fill="#1d4ed8" opacity="0.18" filter="url(#neonBlur)" />
  <circle cx="950" cy="400" r="280" fill="#7c3aed" opacity="0.14" filter="url(#neonBlur)" />
  <circle cx="600" cy="300" r="180" fill="#06b6d4" opacity="0.1" filter="url(#neonBlur)" />

  <!-- Radar Circles -->
  <circle cx="600" cy="300" r="140" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" stroke-dasharray="4,6" />
  <circle cx="600" cy="300" r="240" fill="none" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1" />
  <circle cx="600" cy="300" r="340" fill="none" stroke="rgba(59, 130, 246, 0.08)" stroke-width="1" />

  <!-- Connected Highway Edges -->
  <g stroke="rgba(59, 130, 246, 0.4)" stroke-width="2">
    <line x1="220" y1="200" x2="420" y2="160" />
    <line x1="420" y1="160" x2="600" y2="240" />
    <line x1="600" y1="240" x2="800" y2="180" />
    <line x1="800" y1="180" x2="980" y2="260" />
    <line x1="220" y1="200" x2="350" y2="380" />
    <line x1="350" y1="380" x2="550" y2="420" />
    <line x1="550" y1="420" x2="780" y2="380" />
    <line x1="780" y1="380" x2="980" y2="260" />
    <line x1="420" y1="160" x2="550" y2="420" />
    <line x1="600" y1="240" x2="780" y2="380" />
  </g>

  <!-- Optimal Emergency Corridor (Highlighted Green Line) -->
  <path d="M 220 200 L 420 160 L 600 240 L 780 380 L 980 260" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" filter="url(#neonBlur)" />
  <path d="M 220 200 L 420 160 L 600 240 L 780 380 L 980 260" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="10,8" />

  <!-- Graph Nodes -->
  <g fill="#1e293b" stroke="#3b82f6" stroke-width="3">
    <circle cx="220" cy="200" r="14" fill="#ef4444" stroke="#ffffff" />
    <circle cx="420" cy="160" r="10" />
    <circle cx="600" cy="240" r="12" fill="#3b82f6" />
    <circle cx="800" cy="180" r="9" />
    <circle cx="980" cy="260" r="16" fill="#10b981" stroke="#ffffff" />
    <circle cx="350" cy="380" r="10" />
    <circle cx="550" cy="420" r="11" />
    <circle cx="780" cy="380" r="12" fill="#10b981" />
  </g>

  <!-- Node Labels -->
  <text x="220" y="170" fill="#f87171" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🚨 INCIDENT SCENE</text>
  <text x="980" y="300" fill="#34d399" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🏥 AIIMS BHUBANESWAR</text>
  <text x="600" y="275" fill="#93c5fd" font-size="11" font-family="sans-serif" text-anchor="middle">Jaydev Vihar Sq</text>
  <text x="780" y="415" fill="#93c5fd" font-size="11" font-family="sans-serif" text-anchor="middle">Khandagiri Sq</text>

  <!-- Hero Header Typography -->
  <text x="600" y="80" fill="#ffffff" font-size="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="2" text-anchor="middle">
    SMARTRoute : INTELLIGENT EMERGENCY SYSTEM
  </text>
  <text x="600" y="112" fill="#94a3b8" font-size="14" font-family="sans-serif" letter-spacing="4" text-anchor="middle">
    GRAPH THEORY • DIJKSTRA • A* SEARCH • MAX-HEAP PRIORITY TRIAGE
  </text>

  <!-- Metric Badges Bottom -->
  <g transform="translate(180, 500)">
    <rect width="240" height="60" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="26" fill="#64748b" font-size="11" font-family="sans-serif">ALGORITHM EFFICIENCY</text>
    <text x="20" y="48" fill="#34d399" font-size="18" font-family="sans-serif" font-weight="bold">39.1% Nodes Saved</text>
  </g>
  <g transform="translate(480, 500)">
    <rect width="240" height="60" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="26" fill="#64748b" font-size="11" font-family="sans-serif">TRIAGE LATENCY</text>
    <text x="20" y="48" fill="#60a5fa" font-size="18" font-family="sans-serif" font-weight="bold">O(log N) Max-Heap</text>
  </g>
  <g transform="translate(780, 500)">
    <rect width="240" height="60" rx="12" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="26" fill="#64748b" font-size="11" font-family="sans-serif">ROUTING ENGINE</text>
    <text x="20" y="48" fill="#c084fc" font-size="18" font-family="sans-serif" font-weight="bold">Sub-Millisecond ETA</text>
  </g>
</svg>
