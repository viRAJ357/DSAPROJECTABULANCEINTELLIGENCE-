services:
  - type: web
    name: smartroute-emergency-system
    env: python
    buildCommand: "cd smartroute-frontend && npm install && npm run build && cd ../smartroute-backend && pip install -r requirements.txt"
    startCommand: "cd smartroute-backend && python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.10.0
